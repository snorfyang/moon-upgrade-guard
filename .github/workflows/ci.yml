name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # The module only promises the native target, so CI only checks native.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: toolchain
        run: moon version --all

      # The registry index does not ship with the toolchain, and the module
      # depends on `moonbitlang/async`, so it has to be fetched before any
      # command that resolves the dependency graph.
      - name: package registry index
        run: moon update

      - name: formatting
        run: moon fmt --check

      - name: type check
        run: moon check --deny-warn

      - name: tests
        run: moon test --deny-warn

      - name: generate interfaces
        run: moon info

      - name: generate the diagnostics reference
        run: python3 scripts/gen_diagnostics_doc.py

      # `git diff` ignores untracked files, so a generated file that was deleted
      # would be recreated and still look clean. Compare the whole tree instead:
      # modifications, deletions, and new untracked files all fail.
      - name: generated files are committed
        run: test -z "$(git status --porcelain)"

      - name: whitespace
        run: git diff --check

      # Builds the native executable and checks the CLI's exit codes, JSON
      # output, and byte-identical reruns against `fixtures/`.
      # Every `console` block in the READMEs is a transcript: its commands,
      # output, and exit codes are compared against the binary.
      - name: documented examples are current
        run: python3 scripts/check_readme_examples.py

      - name: cli end to end
        run: ./scripts/e2e.sh
